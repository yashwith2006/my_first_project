<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muscle Workout Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <p class="eyebrow">Gym Planner</p>
          <h1>Workout Finder</h1>
        </div>
      </header>

      <section class="search-panel">
        <label for="muscleInput">Enter a muscle to target</label>
        <div class="input-row">
          <input
            id="muscleInput"
            type="text"
            list="muscleList"
            placeholder="Example: chest, biceps, back, legs"
            aria-label="Target muscle"
          />
          <button id="searchBtn" type="button">Show Plan</button>
        </div>
        <datalist id="muscleList"></datalist>
      </section>

      <section id="result" class="result" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
